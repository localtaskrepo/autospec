# Same compiler and clippy locally, in CI and for releases: new clippy lints arrive with new Rust versions, and an
# unpinned "stable" broke a lotar release (2026-09). CI installs this toolchain with `rustup toolchain install`, which
# reads this file. The weekly security pass bumps the minor version. "1.100" takes the latest 1.100.x patch.
[toolchain]
channel = "1.100"
profile = "minimal"
components = ["rustfmt", "clippy"]
